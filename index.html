<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chystá se něco velkého</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #111111;
            font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            transition: background-color 1.2s ease, color 1.2s ease;
        }

        body.is-active {
            background-color: #3355F5;
            color: #ffffff;
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 500;
            letter-spacing: -0.01em;
            line-height: 1.4;
            color: inherit;
        }

        a {
            margin-top: 2.5rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.95rem;
            font-weight: 400;
            color: inherit;
            text-decoration: none;
            letter-spacing: 0.02em;
            padding-bottom: 2px;
            border-bottom: 1px solid currentColor;
            transition: opacity 0.2s ease;
        }

        a:hover {
            opacity: 0.7;
        }

        a svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.4s ease;
        }

        a:hover svg {
            transform: translate(2px, -2px);
        }
    </style>
</head>
<body>
    <h1>Chystá se něco velkého.</h1>
    <a href="https://www.instagram.com/meetcranberry" target="_blank" rel="noopener">
        @meetcranberry
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 17L17 7"></path>
            <path d="M8 7h9v9"></path>
        </svg>
    </a>

    <script>
        setTimeout(() => {
            document.body.classList.add('is-active');
        }, 2500);
    </script>
</body>
</html>
